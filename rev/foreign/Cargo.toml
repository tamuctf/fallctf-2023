[package]
name = "foreign"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
hex-literal = "0.4.1"
rand = { version = "0.8.5" }
rand_chacha = { version = "0.3" }
tokio = { version = "1.32", features = ["full"] }

[profile.release]
strip = true
lto = true
opt-level = 3
debug = false
