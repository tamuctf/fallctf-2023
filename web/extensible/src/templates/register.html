<!DOCTYPE html>
<html>
  <!--Design pulled from template: https://bootsnipp.com/snippets/vl4R7-->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="stylesheet" href="static/login.css">
    
    <title>FallCTF - Extensible</title>
  </head>
  <body>
    <div class="container">
      <div class="d-flex justify-content-center h-100">
        <div class="card">
          <div class="card-header">
            <h3>Register</h3>
            <div class="d-flex justify-content-end social-icon">
              <span><i class="fab fa-facebook-square"></i></span>
              <span><i class="fab fa-google-plus-square"></i></span>
              <span><i class="fab fa-twitter-square"></i></span>
            </div>
          </div>
          <div class="card-body">
            <form id="register-form">
              <div class="input-group form-group">
                <div class="input-group-prepend">
                  <span class="input-group-text"><i class="fas fa-user"></i></span>
                </div>
                <input id="username" name="username" type="text" class="form-control" placeholder="Username">
              </div>
              <div class="input-group form-group">
                <div class="input-group-prepend">
                  <span class="input-group-text"><i class="fas fa-key"></i></span>
                </div>
                <input id="password" name="password" type="text" class="form-control" placeholder="Password">
              </div>
              <div class="form-group">
                <input type="submit" value="Register" class="btn float-right login-btn">
              </div>
            </form>
          </div>
          <div class="card-footer">
            <div class="d-flex justify-content-center links" id='card-bottom'>
              Already have an account?<a href="/login">Log in</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <script src="/static/xmltojson.js"></script>
    <script>
      const form = document.getElementById('register-form');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        var data = new FormData(document.querySelector('form'));

        fetch('/api/register', {
          method: 'POST',
          credentials: "same-origin",
          headers: {'Content-Type': 'application/xml'},
          body: jsonToXml(JSON.stringify(Object.fromEntries(data)))
        }).then(response => 
          response.text()
        ).then(text => {
          document.getElementById('card-bottom').innerHTML = text;
          setTimeout(() => document.getElementById('card-bottom').innerHTML = 'Already have an account?<a href="/login">Log in</a>', 5000);
        });
      });
    </script>
  <body>
</html>
